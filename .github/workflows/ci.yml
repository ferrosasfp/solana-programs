name: escrow-ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Pinned toolchain (matches the versions used in F3 development).
      SOLANA_VERSION: "3.1.10"
      ANCHOR_VERSION: "1.1.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rustc/cargo, pinned to the exact channel of rust-toolchain.toml (1.89.0,
      # the version anchor-cli 1.1.2 pinned the project on) for reproducible,
      # audit-ready builds. Must stay in sync with rust-toolchain.toml.
      - name: Install Rust (program toolchain)
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      # A second, modern host toolchain used ONLY to build the Anchor CLI binary.
      # anchor-cli 1.1.2 pulls cargo-platform 0.3.3, whose minimum supported rustc
      # is above 1.89.0, so building the tool with the program's pinned channel
      # fails before the program is ever compiled. The program itself is still
      # built with 1.89.0: rust-toolchain.toml applies inside the checkout.
      - name: Install Rust (host toolchain for the CLI)
        uses: dtolnay/rust-toolchain@stable

      # Solana / Agave CLI (provides cargo build-sbf + the SBF platform-tools).
      - name: Install Solana (Agave)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Solana version
        run: solana --version

      # Anchor CLI from crates.io at the exact project version, with --locked so the
      # tool's own dependency graph cannot drift under us. This replaces the previous
      # `cargo install --git ... avm` step, which built avm from the repository's
      # moving HEAD and broke as soon as an unrelated transitive dependency raised
      # its minimum rustc. `+stable` overrides rust-toolchain.toml for this command
      # only (see the toolchain steps above).
      - name: Install Anchor CLI
        run: |
          cargo +stable install anchor-cli --version ${ANCHOR_VERSION} --locked
          anchor --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JS deps
        run: npm ci

      - name: Anchor build
        run: anchor build

      # bankrun is self-contained (no local validator / no cluster).
      # --skip-deploy prevents any devnet deploy (CD-5: deploy is devnet-only and
      # gated to scripts/deploy-devnet.sh, never CI).
      - name: Anchor test
        run: anchor test --skip-build --skip-deploy --skip-local-validator
