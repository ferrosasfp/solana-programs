skip_local_validator = true

[toolchain]
anchor_version = "1.1.2"

[features]
resolution = true
skip-lint = false

# CD-5: deploy target is devnet only (see [provider] + scripts/deploy-devnet.sh).
# [programs.localnet] is required solely by `anchor-bankrun` startAnchor to locate
# target/deploy/escrow.so for the in-process test validator. It does NOT change the
# deploy cluster (the deploy script pins --provider.cluster devnet).
[programs.localnet]
escrow = "BBQ9TcriBT7tqe5czR72CkUyxYg6z8pH7nk161yh79WA"

[programs.devnet]
escrow = "BBQ9TcriBT7tqe5czR72CkUyxYg6z8pH7nk161yh79WA"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[hooks]
